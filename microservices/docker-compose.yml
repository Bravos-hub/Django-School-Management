version: '3.8'

services:
  # PostgreSQL Databases
  postgres-auth:
    image: postgres:15-alpine
    container_name: school-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  postgres-student:
    image: postgres:15-alpine
    container_name: school-student-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_db
    ports:
      - "5434:5432"
    volumes:
      - student_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  postgres-academic:
    image: postgres:15-alpine
    container_name: school-academic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academic_db
    ports:
      - "5435:5432"
    volumes:
      - academic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: school-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: school-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres-auth:5432/auth_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./auth-service/src:/app/src
      - ./auth-service/prisma:/app/prisma
    networks:
      - school-network

  # Student Service
  student-service:
    build:
      context: ./student-service
      dockerfile: Dockerfile
    container_name: school-student-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres-student:5432/student_db?schema=public
      AUTH_SERVICE_URL: http://auth-service:3001
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      postgres-student:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./student-service/src:/app/src
      - ./student-service/prisma:/app/prisma
    networks:
      - school-network

  # Academic Service
  academic-service:
    build:
      context: ./academic-service
      dockerfile: Dockerfile
    container_name: school-academic-service
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres-academic:5432/academic_db?schema=public
      AUTH_SERVICE_URL: http://auth-service:3001
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3003:3003"
    depends_on:
      postgres-academic:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./academic-service/src:/app/src
      - ./academic-service/prisma:/app/prisma
    networks:
      - school-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: school-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      STUDENT_SERVICE_URL: http://student-service:3002
      ACADEMIC_SERVICE_URL: http://academic-service:3003
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - student-service
      - academic-service
    networks:
      - school-network

volumes:
  auth_db_data:
  student_db_data:
  academic_db_data:
  redis_data:

networks:
  school-network:
    driver: bridge
